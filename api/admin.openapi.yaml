openapi: 3.0.3
info:
  title: Pratu Admin API
  version: 0.5.0
  description: |
    The platform management plane. Runs on its own listener (`:4434` by
    default) and must never be reachable through tenant hostnames or the
    public internet. Every `/admin/*` request carries an admin key as a
    bearer token.

    That key is either the root key, which is unrestricted, or one of the
    configured capability-limited keys, which may perform only the
    capabilities they were granted and only on the Tenants their slug
    patterns admit (ADR 0009). Each operation below names the capability
    it requires; a key that holds a valid secret but not that capability
    gets `403` naming what it lacks, as against `401` for a key that is
    not recognised at all. Keys are configured under `admin.keys`, not
    managed through this API.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: "http://localhost:4434"
    description: Local development
security:
  - rootKey: []
tags:
  - name: tenants
  - name: clients
  - name: schemas
  - name: keys
  - name: social
  - name: domains
  - name: sessions

paths:
  /health/alive:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /health/ready:
    get:
      summary: Readiness probe (pings the database)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Error" }

  /admin/tenants:
    post:
      x-required-capability: "tenants:create"
      tags: [tenants]
      summary: Create a tenant
      description: |
        Creates the tenant and seeds its `default` Identity Schema (email
        identifier with verification and recovery annotations). The slug
        becomes the tenant's subdomain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      x-required-capability: "tenants:read"
      tags: [tenants]
      summary: List tenants
      responses:
        "200":
          description: Tenants, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
  /admin/tenants/{slug}:
    get:
      x-required-capability: "tenants:read"
      tags: [tenants]
      summary: Fetch one tenant
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      x-required-capability: "tenants:update"
      tags: [tenants]
      summary: Update a tenant's name and policy
      description: |
        Absent keys are left alone, so one policy can be flipped without
        resending (or accidentally wiping) the rest. A key that is present
        replaces its value outright, nested blocks (`password`, `ui`)
        included — send the whole block to change one of its fields.

        The patched policy is validated as a whole and applied under a row
        lock, so a rejected patch changes nothing and concurrent edits
        queue instead of overwriting each other. The tenant's slug is its
        identity and cannot be changed.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantPatch" }
      responses:
        "200":
          description: The updated tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      x-required-capability: "tenants:disable, plus tenants:purge when ?purge=true"
      tags: [tenants]
      summary: Disable a tenant (soft delete)
      description: |
        Switches the tenant off: it resolves from no hostname, so its
        Self-Service Flows, OAuth2 endpoints, JWKS and discovery all stop
        answering at once. Nothing it owns is destroyed — identities,
        sessions and clients survive — and its slug stays held, because
        freeing it would let the hostname come to mean a different
        identity namespace (ADR 0008). Reopen with `POST .../enable`.

        Idempotent: disabling an already-disabled tenant answers as the
        first call did, `disabled_at` included, so a compensating saga can
        run twice. A slug that was never there is a 404.

        Not a revocation primitive: an already-issued access token stays
        valid until it expires, though a resource server that re-fetches
        JWKS can no longer reach it.

        `?purge=true` instead destroys the tenant and everything it owns
        — identities, credentials, sessions, clients, keys — and frees
        the slug for re-use. Irreversible, and refused with 409 unless
        the tenant is already disabled: destruction is a deliberate
        second step, never the meaning of a bare DELETE. A `purge` value
        that is not a boolean is a 400, so a typo can never be read as
        the safer verb.
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - name: purge
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Destroy the tenant instead of disabling it
      responses:
        "200":
          description: |
            The disabled tenant, carrying `disabled_at`; for a purge,
            `{ "state": "purged", "slug": "..." }`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/enable:
    post:
      x-required-capability: "tenants:disable"
      tags: [tenants]
      summary: Re-enable a disabled tenant
      description: |
        Reopens the tenant's public surface. Sessions were never revoked,
        so it comes back whole rather than signed out. Idempotent on a
        tenant that is already live.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: The live tenant, with no `disabled_at`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/clients:
    post:
      x-required-capability: "clients:create"
      tags: [clients]
      summary: Create an OAuth2 client
      description: |
        Confidential clients receive a generated secret in the response —
        the only time it exists in plaintext. Public clients get no secret
        and are PKCE-only.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirect_uris]
              properties:
                name: { type: string }
                redirect_uris:
                  type: array
                  items: { type: string, format: uri }
                scopes:
                  type: array
                  items: { type: string }
                  description: Defaults to openid, offline_access, profile, email
                first_party:
                  type: boolean
                  description: First-party clients skip the consent step
                public: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: "#/components/schemas/OAuth2Client" }
                  client_secret: { type: string, description: Shown exactly once }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      x-required-capability: "clients:read"
      tags: [clients]
      summary: List OAuth2 clients
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Clients (no secrets)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OAuth2Client" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/clients/{id}:
    patch:
      x-required-capability: "clients:update"
      tags: [clients]
      summary: Edit an OAuth2 client
      description: |
        Absent keys are left alone; a present key replaces its value
        outright. `client_id`, the secret, and `first_party` are not
        editable — adding a scope or a redirect_uri is a metadata change
        and must not force every consumer holding the credentials to be
        updated in lockstep.
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                redirect_uris:
                  type: array
                  items: { type: string, format: uri }
                  description: At least one, absolute and without a fragment
                scopes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The edited client (no secret)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuth2Client" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      x-required-capability: "clients:delete"
      tags: [clients]
      summary: Delete an OAuth2 client
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/clients/{id}/rotate-secret:
    post:
      x-required-capability: "clients:rotate-secret"
      tags: [clients]
      summary: Rotate an OAuth2 client secret
      description: |
        Mints a fresh secret for a confidential client and returns it —
        again, the only time it exists in plaintext. The `client_id` is
        unchanged, so a lost or leaked secret is replaced without
        re-identifying the client everywhere it is configured. The
        previous secret stops authenticating immediately. Public clients
        have no secret and are refused.
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
                  client_id: { type: string, description: Unchanged }
                  client_secret: { type: string, description: Shown exactly once }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/schemas:
    get:
      x-required-capability: "schemas:read"
      tags: [schemas]
      summary: List Identity Schema versions
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Every version of every named schema
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchemaInfo" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/schemas/{name}:
    get:
      x-required-capability: "schemas:read"
      tags: [schemas]
      summary: Fetch the current version of a named schema
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/schemaName" }
      responses:
        "200":
          description: Current version with the raw JSON Schema
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SchemaInfo"
                  - type: object
                    properties:
                      schema: { type: object }
        "404": { $ref: "#/components/responses/Error" }
    put:
      x-required-capability: "schemas:write"
      tags: [schemas]
      summary: Publish a new version of a named schema
      description: |
        The body is the raw JSON Schema. It must compile and annotate at
        least one property with `"pratu": {"identifier": true}`. Versions
        are immutable: this appends (creating the name at version 1);
        identities keep the version that validated them, and new
        registration flows pin the version current at creation.
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/schemaName" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A JSON Schema document }
      responses:
        "201":
          description: New version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/keys:
    get:
      x-required-capability: "keys:read"
      tags: [keys]
      summary: List signing keys (never private material)
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KeyInfo" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/keys/rotate:
    post:
      x-required-capability: "keys:rotate"
      tags: [keys]
      summary: Rotate the signing key
      description: |
        Retires the active key (it stays in the JWKS verifying issued
        tokens) and mints a fresh one; the next token signs with the new
        kid. Refresh tokens are unaffected by rotation.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
                  kid: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/keys/{kid}:
    delete:
      x-required-capability: "keys:delete"
      tags: [keys]
      summary: Delete a retired key (tokens it signed stop verifying)
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - name: kid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/social:
    get:
      x-required-capability: "social:read"
      tags: [social]
      summary: List social providers (no secrets)
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: The tenant's provider registry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialProvider" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/social/{provider}:
    put:
      x-required-capability: "social:write"
      tags: [social]
      summary: Create or replace a social provider
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/provider" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, client_id, client_secret]
              properties:
                kind: { type: string, enum: [oidc, github] }
                label: { type: string }
                issuer:
                  type: string
                  format: uri
                  description: Required for kind oidc (discovery base URL)
                client_id: { type: string }
                client_secret: { type: string, description: Sealed at rest }
                scopes:
                  type: array
                  items: { type: string }
                  description: "Defaults: oidc → openid email profile; github → read:user user:email"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      x-required-capability: "social:delete"
      tags: [social]
      summary: Delete a social provider
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/provider" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/domains:
    get:
      x-required-capability: "domains:read"
      tags: [domains]
      summary: List the tenant's custom domains
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Claimed domains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    domain: { type: string }
                    created_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/domains/{domain}:
    put:
      x-required-capability: "domains:write"
      tags: [domains]
      summary: Claim a custom domain for the tenant
      description: |
        Routes the hostname to this tenant (idempotent for the same
        tenant; 409 if another tenant holds it). Domains under the base
        domain are refused — those are addressed by slug. DNS (CNAME to
        the deployment) and TLS termination belong to the fronting proxy.
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/domain" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      x-required-capability: "domains:delete"
      tags: [domains]
      summary: Release a custom domain
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/domain" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/identities/{id}/sessions:
    get:
      x-required-capability: "sessions:read"
      tags: [sessions]
      summary: List an identity's live sessions
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/identityId" }
      responses:
        "200":
          description: Sessions (never tokens)
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      x-required-capability: "sessions:revoke"
      tags: [sessions]
      summary: "Kill-switch: revoke every session of an identity"
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/identityId" }
      responses:
        "200":
          description: Count of revoked sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
                  revoked: { type: integer }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    rootKey:
      type: http
      scheme: bearer
      description: |
        An admin key: the unrestricted root key
        (`PRATU_ADMIN_ROOT_KEY`), or a capability-limited key configured
        under `admin.keys` (`PRATU_ADMIN_KEY_<NAME>`).
  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    schemaName:
      name: name
      in: path
      required: true
      schema: { type: string }
    provider:
      name: provider
      in: path
      required: true
      schema: { type: string }
    domain:
      name: domain
      in: path
      required: true
      schema: { type: string }
    identityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Status:
      description: Simple state acknowledgment
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { type: string }
              status: { type: string }
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message: { type: string }
                  details:
                    type: array
                    items: { type: string }
  schemas:
    TenantCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: DNS label; becomes the tenant's subdomain
        name: { type: string }
        verification:
          type: string
          enum: [required, deferred]
          description: Default required
        password:
          type: object
          properties:
            min_length: { type: integer, minimum: 8, maximum: 128 }
            breach_check: { type: boolean, description: Default true }
        sms_daily_cap: { type: integer }
        mfa:
          type: string
          enum: [off, optional, required]
          description: Default optional
        first_factor:
          type: array
          description: |
            The accepted first factors (ADR 0007). Default ["password"].
            Include "code" to let an identity sign in by proving a
            verification-annotated address with a One-Time Code, with no
            password credential involved.
          items:
            type: string
            enum: [password, code]
        login_throttle: { $ref: "#/components/schemas/LoginThrottle" }
        ui:
          type: object
          description: |
            The tenant's own screens. Browser Flows drive HTML clients
            here by redirect; each flow kind has its own screen.
          properties:
            login_url: { type: string, format: uri, description: "Login screen; OAuth2 challenges redirect here too" }
            registration_url: { type: string, format: uri }
            recovery_url: { type: string, format: uri }
            verification_url: { type: string, format: uri }
            error_url:
              type: string
              format: uri
              description: Where failures with no flow to return to land, with a ?code= parameter
            default_return_url:
              type: string
              format: uri
              description: Where a completed Browser Flow lands when it carries no return_to
            allowed_return_urls:
              type: array
              items: { type: string, format: uri }
              description: |
                Extra return_to targets beyond the origins of the screens
                above (for apps served from another origin).
        login_url:
          type: string
          format: uri
          deprecated: true
          description: Superseded by ui.login_url; still read as a fallback
        social_return_url:
          type: string
          format: uri
          deprecated: true
          description: Superseded by ui.default_return_url; still read as a fallback
    TenantPatch:
      type: object
      description: |
        Every key is optional; only the keys present are changed. Same
        value shapes and validation as TenantCreate, minus `slug`, which
        is the tenant's identity and immutable.
      properties:
        name: { type: string }
        verification:
          type: string
          enum: [required, deferred]
        password:
          type: object
          properties:
            min_length: { type: integer, minimum: 8, maximum: 128 }
            breach_check: { type: boolean }
        sms_daily_cap: { type: integer }
        mfa:
          type: string
          enum: [off, optional, required]
        first_factor:
          type: array
          items:
            type: string
            enum: [password, code]
        login_throttle:
          allOf:
            - $ref: "#/components/schemas/LoginThrottle"
            - description: Replaced as a whole when present
        ui:
          type: object
          description: Replaced as a whole when present
        login_url: { type: string, format: uri, deprecated: true }
        social_return_url: { type: string, format: uri, deprecated: true }
    LoginThrottle:
      type: object
      description: |
        Bounds login attempts per identifier, per tenant. Omit — or send
        zeroes — for the strict default of 5 attempts per 60 seconds.

        The knob exists so that a test tenant, whose suite signs the same
        handful of identities in repeatedly, can be given room without
        loosening anything for a production tenant. It can therefore
        weaken brute-force protection: it reaches one tenant at a time
        and only an operator holding the admin key can turn it. The
        per-IP login limit is platform-wide and not configurable here.
      properties:
        max_attempts:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 0 means the default (5)
        window_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: |
            0 means the default (60). Capped at an hour: a throttle is a
            short-term control, and a longer window is account lockout —
            usually written by mistyping seconds as milliseconds.
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        config: { type: object }
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the tenant was switched off; absent while it is live.
            A disabled tenant resolves from no hostname.
    OAuth2Client:
      type: object
      properties:
        client_id: { type: string }
        name: { type: string }
        public: { type: boolean }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        scopes:
          type: array
          items: { type: string }
        first_party: { type: boolean }
    SchemaInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    KeyInfo:
      type: object
      properties:
        kid: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    SocialProvider:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [oidc, github] }
        label: { type: string }
        issuer: { type: string }
        client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
