openapi: 3.0.3
info:
  title: Pratu Admin API
  version: 0.4.0
  description: |
    The platform management plane. Runs on its own listener (`:4434` by
    default) and must never be reachable through tenant hostnames or the
    public internet. Every `/admin/*` request requires the root API key
    as a bearer token.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: "http://localhost:4434"
    description: Local development
security:
  - rootKey: []
tags:
  - name: tenants
  - name: clients
  - name: schemas
  - name: keys
  - name: social
  - name: domains
  - name: sessions

paths:
  /health/alive:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /health/ready:
    get:
      summary: Readiness probe (pings the database)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Error" }

  /admin/tenants:
    post:
      tags: [tenants]
      summary: Create a tenant
      description: |
        Creates the tenant and seeds its `default` Identity Schema (email
        identifier with verification and recovery annotations). The slug
        becomes the tenant's subdomain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [tenants]
      summary: List tenants
      responses:
        "200":
          description: Tenants, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
  /admin/tenants/{slug}:
    get:
      tags: [tenants]
      summary: Fetch one tenant
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [tenants]
      summary: Update a tenant's name and policy
      description: |
        Absent keys are left alone, so one policy can be flipped without
        resending (or accidentally wiping) the rest. A key that is present
        replaces its value outright, nested blocks (`password`, `ui`)
        included — send the whole block to change one of its fields.

        The patched policy is validated as a whole and applied under a row
        lock, so a rejected patch changes nothing and concurrent edits
        queue instead of overwriting each other. The tenant's slug is its
        identity and cannot be changed.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantPatch" }
      responses:
        "200":
          description: The updated tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/clients:
    post:
      tags: [clients]
      summary: Create an OAuth2 client
      description: |
        Confidential clients receive a generated secret in the response —
        the only time it exists in plaintext. Public clients get no secret
        and are PKCE-only.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirect_uris]
              properties:
                name: { type: string }
                redirect_uris:
                  type: array
                  items: { type: string, format: uri }
                scopes:
                  type: array
                  items: { type: string }
                  description: Defaults to openid, offline_access, profile, email
                first_party:
                  type: boolean
                  description: First-party clients skip the consent step
                public: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: "#/components/schemas/OAuth2Client" }
                  client_secret: { type: string, description: Shown exactly once }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [clients]
      summary: List OAuth2 clients
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Clients (no secrets)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OAuth2Client" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/clients/{id}:
    delete:
      tags: [clients]
      summary: Delete an OAuth2 client
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/schemas:
    get:
      tags: [schemas]
      summary: List Identity Schema versions
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Every version of every named schema
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchemaInfo" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/schemas/{name}:
    get:
      tags: [schemas]
      summary: Fetch the current version of a named schema
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/schemaName" }
      responses:
        "200":
          description: Current version with the raw JSON Schema
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SchemaInfo"
                  - type: object
                    properties:
                      schema: { type: object }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [schemas]
      summary: Publish a new version of a named schema
      description: |
        The body is the raw JSON Schema. It must compile and annotate at
        least one property with `"pratu": {"identifier": true}`. Versions
        are immutable: this appends (creating the name at version 1);
        identities keep the version that validated them, and new
        registration flows pin the version current at creation.
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/schemaName" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A JSON Schema document }
      responses:
        "201":
          description: New version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/keys:
    get:
      tags: [keys]
      summary: List signing keys (never private material)
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Keys, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KeyInfo" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/keys/rotate:
    post:
      tags: [keys]
      summary: Rotate the signing key
      description: |
        Retires the active key (it stays in the JWKS verifying issued
        tokens) and mints a fresh one; the next token signs with the new
        kid. Refresh tokens are unaffected by rotation.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
                  kid: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/keys/{kid}:
    delete:
      tags: [keys]
      summary: Delete a retired key (tokens it signed stop verifying)
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - name: kid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/social:
    get:
      tags: [social]
      summary: List social providers (no secrets)
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: The tenant's provider registry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialProvider" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/social/{provider}:
    put:
      tags: [social]
      summary: Create or replace a social provider
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/provider" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, client_id, client_secret]
              properties:
                kind: { type: string, enum: [oidc, github] }
                label: { type: string }
                issuer:
                  type: string
                  format: uri
                  description: Required for kind oidc (discovery base URL)
                client_id: { type: string }
                client_secret: { type: string, description: Sealed at rest }
                scopes:
                  type: array
                  items: { type: string }
                  description: "Defaults: oidc → openid email profile; github → read:user user:email"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [social]
      summary: Delete a social provider
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/provider" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/domains:
    get:
      tags: [domains]
      summary: List the tenant's custom domains
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: Claimed domains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    domain: { type: string }
                    created_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /admin/tenants/{slug}/domains/{domain}:
    put:
      tags: [domains]
      summary: Claim a custom domain for the tenant
      description: |
        Routes the hostname to this tenant (idempotent for the same
        tenant; 409 if another tenant holds it). Domains under the base
        domain are refused — those are addressed by slug. DNS (CNAME to
        the deployment) and TLS termination belong to the fronting proxy.
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/domain" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [domains]
      summary: Release a custom domain
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/domain" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/tenants/{slug}/identities/{id}/sessions:
    get:
      tags: [sessions]
      summary: List an identity's live sessions
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/identityId" }
      responses:
        "200":
          description: Sessions (never tokens)
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [sessions]
      summary: "Kill-switch: revoke every session of an identity"
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { $ref: "#/components/parameters/identityId" }
      responses:
        "200":
          description: Count of revoked sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string }
                  revoked: { type: integer }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    rootKey:
      type: http
      scheme: bearer
      description: The platform root API key (PRATU_ADMIN_ROOT_KEY)
  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    schemaName:
      name: name
      in: path
      required: true
      schema: { type: string }
    provider:
      name: provider
      in: path
      required: true
      schema: { type: string }
    domain:
      name: domain
      in: path
      required: true
      schema: { type: string }
    identityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Status:
      description: Simple state acknowledgment
      content:
        application/json:
          schema:
            type: object
            properties:
              state: { type: string }
              status: { type: string }
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message: { type: string }
                  details:
                    type: array
                    items: { type: string }
  schemas:
    TenantCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: DNS label; becomes the tenant's subdomain
        name: { type: string }
        verification:
          type: string
          enum: [required, deferred]
          description: Default required
        password:
          type: object
          properties:
            min_length: { type: integer, minimum: 8, maximum: 128 }
            breach_check: { type: boolean, description: Default true }
        sms_daily_cap: { type: integer }
        mfa:
          type: string
          enum: [off, optional, required]
          description: Default optional
        first_factor:
          type: array
          description: |
            The accepted first factors (ADR 0007). Default ["password"].
            Include "code" to let an identity sign in by proving a
            verification-annotated address with a One-Time Code, with no
            password credential involved.
          items:
            type: string
            enum: [password, code]
        ui:
          type: object
          description: |
            The tenant's own screens. Browser Flows drive HTML clients
            here by redirect; each flow kind has its own screen.
          properties:
            login_url: { type: string, format: uri, description: "Login screen; OAuth2 challenges redirect here too" }
            registration_url: { type: string, format: uri }
            recovery_url: { type: string, format: uri }
            verification_url: { type: string, format: uri }
            error_url:
              type: string
              format: uri
              description: Where failures with no flow to return to land, with a ?code= parameter
            default_return_url:
              type: string
              format: uri
              description: Where a completed Browser Flow lands when it carries no return_to
            allowed_return_urls:
              type: array
              items: { type: string, format: uri }
              description: |
                Extra return_to targets beyond the origins of the screens
                above (for apps served from another origin).
        login_url:
          type: string
          format: uri
          deprecated: true
          description: Superseded by ui.login_url; still read as a fallback
        social_return_url:
          type: string
          format: uri
          deprecated: true
          description: Superseded by ui.default_return_url; still read as a fallback
    TenantPatch:
      type: object
      description: |
        Every key is optional; only the keys present are changed. Same
        value shapes and validation as TenantCreate, minus `slug`, which
        is the tenant's identity and immutable.
      properties:
        name: { type: string }
        verification:
          type: string
          enum: [required, deferred]
        password:
          type: object
          properties:
            min_length: { type: integer, minimum: 8, maximum: 128 }
            breach_check: { type: boolean }
        sms_daily_cap: { type: integer }
        mfa:
          type: string
          enum: [off, optional, required]
        first_factor:
          type: array
          items:
            type: string
            enum: [password, code]
        ui:
          type: object
          description: Replaced as a whole when present
        login_url: { type: string, format: uri, deprecated: true }
        social_return_url: { type: string, format: uri, deprecated: true }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        config: { type: object }
    OAuth2Client:
      type: object
      properties:
        client_id: { type: string }
        name: { type: string }
        public: { type: boolean }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        scopes:
          type: array
          items: { type: string }
        first_party: { type: boolean }
    SchemaInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    KeyInfo:
      type: object
      properties:
        kid: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    SocialProvider:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [oidc, github] }
        label: { type: string }
        issuer: { type: string }
        client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
