services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Published clear of 5432: a developer machine often already runs a
      # Postgres there.
      - "35432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/devdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
