services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pratu
      POSTGRES_PASSWORD: pratu
      POSTGRES_DB: pratu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratu"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
